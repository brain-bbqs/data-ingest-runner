name: Scheduled Ingest

permissions:
  contents: read

on:
  schedule:
    - cron: "0 0 * * *"

# Literal group name, shared with Manual Ingest: github.workflow differs
# between the two entry points, so a constant is what keeps a manual run
# and a scheduled run from ingesting at the same time.
concurrency:
  group: ingest
  cancel-in-progress: false

jobs:
  Ingest:
    uses: ./.github/workflows/ingest.yml
    # No inputs: a scheduled run is always a full, non-dry run against
    # TASK_FORCE_REF (or main). Overrides live on Manual Ingest.
    secrets:
      EMBER_DANDI_API_KEY: ${{ secrets.EMBER_DANDI_API_KEY }}
      TRACKING_TOKEN: ${{ secrets.TRACKING_TOKEN }}
      MAIL_USERNAME: ${{ secrets.MAIL_USERNAME }}
      MAIL_PASSWORD: ${{ secrets.MAIL_PASSWORD }}

  # Same delivery as ingest.yml's NotifyOnFailure. Sends every scheduled run while the
  # runner's work drive stays at or above the threshold, so the reminder
  # repeats daily until space is freed. Set the DISK_ALERT_PERCENT
  # repository variable to change the threshold (default 50).
  NotifyOnDiskUsage:
    permissions: {}
    runs-on: ubuntu-latest
    needs: [Ingest]
    if: >-
      ${{ always()
      && needs.Ingest.outputs.disk_percent != ''
      && fromJSON(needs.Ingest.outputs.disk_percent) >= fromJSON(vars.DISK_ALERT_PERCENT || '50') }}
    steps:
      - uses: dawidd6/action-send-mail@v18
        with:
          server_address: smtp.gmail.com
          server_port: 465
          username: ${{ secrets.MAIL_USERNAME }}
          password: ${{ secrets.MAIL_PASSWORD }}
          subject: "Disk Usage ${{ needs.Ingest.outputs.disk_percent }}%: Data Ingest Runner"
          to: cody.c.baker.phd@gmail.com
          from: Data Ingest Runner <data-ingest-runner@users.noreply.github.com>
          body: >-
            The runner's work drive is at or above the ${{ vars.DISK_ALERT_PERCENT || '50' }}% alert threshold:
            ${{ needs.Ingest.outputs.disk_summary }}.
            The current table is in https://github.com/brain-bbqs/data-ingest-runner-tracking#runner-disk-usage

