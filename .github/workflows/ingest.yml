name: Ingest

# Reusable: holds the whole ingest job so the scheduled and manual entry
# points (scheduled_ingest.yml, manual_ingest.yml) stay thin trigger
# wrappers. Not triggerable on its own; runs display under the name of
# whichever workflow called it.

permissions:
  contents: read

on:
  workflow_call:
    inputs:
      dry_run:
        description: "Log actions without downloading, converting, uploading, or writing state"
        type: boolean
        default: false
      only:
        description: "Restrict to one lab name (blank = all registered projects)"
        type: string
        default: ""
      task_force_ref:
        description: "data-ingest-task-force branch/tag/SHA to check out for this run (blank = TASK_FORCE_REF variable, or 'main' if that's also unset)"
        type: string
        default: ""
    secrets:
      EMBER_DANDI_API_KEY:
        description: "DANDI API key for the ember-dandi instance"
        # Not required here so a caller can run --dry-run without it; a real
        # run fails inside dispatch.py if it's missing.
        required: false
      TRACKING_TOKEN:
        description: "Token that can push to brain-bbqs/data-ingest-runner-tracking"
        # Not required, for the same reason. A real run without it still
        # records everything locally, and the push step fails loudly.
        required: false
    outputs:
      disk_percent:
        description: "Percent used on the runner's work drive after this run (blank on a dry run)"
        value: ${{ jobs.Dispatch.outputs.disk_percent }}
      disk_summary:
        description: "One-line summary of the runner's work drive usage"
        value: ${{ jobs.Dispatch.outputs.disk_summary }}

jobs:
  Dispatch:
    runs-on: [self-hosted, ember, ingest]
    outputs:
      disk_percent: ${{ steps.disk.outputs.percent }}
      disk_summary: ${{ steps.disk.outputs.summary }}
    steps:
      - name: Checkout data-ingest-task-force
        uses: actions/checkout@v7
        with:
          repository: brain-bbqs/data-ingest-task-force
          # Caller-supplied ref wins (one-off debugging); falls back to
          # the TASK_FORCE_REF repo variable (a standing override, e.g. to
          # soak-test a branch); falls back to main.
          ref: ${{ inputs.task_force_ref || vars.TASK_FORCE_REF || 'main' }}
          path: task-force

      # Only for setup-tools.sh. Kept in its own subdirectory: checking out
      # to the workspace root would git-clean the ember-* data folders that
      # live there.
      - name: Checkout data-ingest-runner scripts
        if: ${{ inputs.dry_run != true }}
        uses: actions/checkout@v7
        with:
          path: runner
          sparse-checkout: .github/scripts

      # Installs into the runner account's own home, so the host needs no
      # root setup. Built on the first run and reused after. The Rebuild
      # Runner Tools workflow reinstalls it with the latest versions.
      - name: Set up runner tools
        if: ${{ inputs.dry_run != true }}
        run: runner/.github/scripts/setup-tools.sh

      # Fail once, up front, rather than once per project inside dispatch.
      - name: Check runner tools
        if: ${{ inputs.dry_run != true }}
        run: |
          missing=""
          for tool in apptainer singularity git-annex datalad duct; do
            command -v "$tool" > /dev/null || missing="$missing $tool"
          done
          datalad containers-list --help > /dev/null 2>&1 || missing="$missing datalad-container"
          if [ -n "$missing" ]; then
            echo "::error::Missing on the runner's PATH:$missing. Run the Rebuild Runner Tools workflow, then re-run this one."
            exit 1
          fi
          # Unprivileged Apptainer runs containers in user namespaces. The
          # one host setting that needs an admin, if a distribution disables it.
          if ! unshare --user --map-root-user true 2> /dev/null; then
            echo "::error::Unprivileged user namespaces are disabled on this host, which rootless Apptainer needs (see README, Runner setup)."
            exit 1
          fi

      # Lives outside task-force/, which actions/checkout cleans every run,
      # so the dataset and its annexed images persist between runs. The
      # ember-tracking name and location are dispatch.py's own default.
      - name: Update tracking dataset
        if: ${{ inputs.dry_run != true }}
        env:
          TRACKING_URL: https://github.com/brain-bbqs/data-ingest-runner-tracking
        run: |
          set -eu
          # A clone without git-annex set up commits the .sif images to git
          # itself. Nothing in it was pushed (pushing fails without a
          # git-annex branch), so starting over loses nothing on GitHub.
          if [ -d ember-tracking ] && ! git -C ember-tracking config --get annex.uuid > /dev/null; then
            echo "::warning::ember-tracking had no git-annex set up, so it was re-cloned."
            rm -rf ember-tracking
          fi
          if [ ! -d ember-tracking ]; then
            datalad clone "$TRACKING_URL" ember-tracking
            git -C ember-tracking config user.name "data-ingest-runner"
            git -C ember-tracking config user.email "data-ingest-runner@users.noreply.github.com"
            # datalad clone only sets up git-annex when the remote already
            # has a git-annex branch, which it doesn't until the first push.
            git -C ember-tracking config --get annex.uuid > /dev/null || git -C ember-tracking annex init "ember runner"
          fi
          git -C ember-tracking pull --ff-only origin main

      - name: Run dispatch
        working-directory: task-force
        env:
          # dispatch.py forwards this (through the environment only, never
          # as a literal value on a command line) into every container it
          # starts: its own dandi image
          # (dandi download/upload run only in a container now, never
          # directly on this host) and, when set, a project's
          # container_image too, for labs whose conversion step itself
          # needs DANDI access. Kept under its own name, not renamed --
          # dandi-cli looks credentials up per dandi_instance
          # (EMBER_DANDI_API_KEY for ember-dandi), and dispatch.py computes
          # that name itself rather than expecting a generic DANDI_API_KEY.
          EMBER_DANDI_API_KEY: ${{ secrets.EMBER_DANDI_API_KEY }}
          REGISTRY_PATH: ${{ vars.REGISTRY_PATH }}
          SESSIONS_PATH: ${{ vars.SESSIONS_PATH }}
          DRY_RUN_FLAG: ${{ inputs.dry_run == true && '--dry-run' || '' }}
          ONLY_FLAG: ${{ inputs.only != '' && format('--only {0}', inputs.only) || '' }}
        run: |
          set -eu
          # No --incoming-root/--standardized-root/--tracking here: dispatch.py
          # always picks its own default (ember-incoming/ember-standardized/
          # ember-tracking siblings of this checkout) -- not overridable from
          # this workflow.
          REGISTRY_FLAG=""
          [ -n "${REGISTRY_PATH:-}" ] && REGISTRY_FLAG="--registry $REGISTRY_PATH"
          SESSIONS_FLAG=""
          [ -n "${SESSIONS_PATH:-}" ] && SESSIONS_FLAG="--sessions $SESSIONS_PATH"
          python3 dispatch/dispatch.py \
            $REGISTRY_FLAG $SESSIONS_FLAG \
            $DRY_RUN_FLAG $ONLY_FLAG

      # Pushes even when dispatch failed: a failed step's record is committed
      # too, and is the one most worth seeing. Only git history goes up. The
      # annexed images stay on this runner.
      # Committed to the tracking dataset's README, so it goes up with this
      # run's push. Never fails the run: it's a report, not part of ingest.
      - name: Record disk usage
        id: disk
        if: ${{ always() && inputs.dry_run != true }}
        continue-on-error: true
        run: |
          [ -d ember-tracking/.datalad ] || exit 0
          runner/.github/scripts/update-disk-usage.sh ember-tracking "$GITHUB_WORKSPACE"

      - name: Push tracking dataset
        if: ${{ always() && inputs.dry_run != true }}
        env:
          TRACKING_TOKEN: ${{ secrets.TRACKING_TOKEN }}
        run: |
          set -eu
          # Nothing to push when the update step never got a clone in place.
          [ -d ember-tracking/.datalad ] || exit 0
          if [ -z "${TRACKING_TOKEN:-}" ]; then
            echo "::error::TRACKING_TOKEN is not set, so this run's records were committed on the runner but not pushed."
            exit 1
          fi
          # Passed as git config through the environment, so the token is
          # never written to disk or put on a command line.
          header="$(printf 'x-access-token:%s' "$TRACKING_TOKEN" | base64 -w0)"
          echo "::add-mask::$header"
          GIT_CONFIG_COUNT=1 \
          GIT_CONFIG_KEY_0="http.https://github.com/.extraheader" \
          GIT_CONFIG_VALUE_0="AUTHORIZATION: basic $header" \
            git -C ember-tracking push origin HEAD:main git-annex
